<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vayum</title>
<link rel="icon" href="{{ url_for('static', filename='images/vayum-logo.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="landing">

<div class="gate">
  <form class="gate-form" method="POST" action="{{ url_for('select_location') }}">
    <label class="field">
      <span>State</span>
      <select name="state" id="gateState" required>
        <option value="" disabled selected>Choose a state</option>
        {% for s in states %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
      </select>
    </label>

    <label class="field">
      <span>City</span>
      <select name="city" id="gateCity" required disabled>
        <option value="" disabled selected>Choose a state first</option>
      </select>
    </label>

    <button type="submit" class="btn-primary" id="gateGo" disabled>Continue</button>
  </form>
</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>

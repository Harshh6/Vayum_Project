<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Vayum{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='images/vayum-logo.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="{{ url_for('dashboard') if city else url_for('index') }}">
      <img src="{{ url_for('vayum_logo') }}" alt="Vayum">
    </a>

    <nav class="nav-links" id="navLinks">
      <a href="{{ url_for('dashboard') }}" class="{{ 'is-active' if active == 'home' }}">Home</a>
      <a href="{{ url_for('about') }}" class="{{ 'is-active' if active == 'about' }}">About us</a>
      <a href="{{ url_for('help_page') }}" class="{{ 'is-active' if active == 'help' }}">Help us</a>
    </nav>

    <div class="nav-right">
      <form class="locbar" method="POST" action="{{ url_for('select_location') }}">
        <span class="locbar-pin" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
        </span>
        <select name="state" id="navState" aria-label="State">
          {% for s in states %}
          <option value="{{ s }}" {{ 'selected' if s == state }}>{{ s }}</option>
          {% endfor %}
        </select>
        <span class="locbar-divider" aria-hidden="true">|</span>
        <select name="city" id="navCity" data-selected="{{ city }}" aria-label="City"></select>
        <button type="submit" class="btn-search">Search</button>
      </form>
      <button class="nav-toggle" id="navToggle" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main>{% block content %}{% endblock %}</main>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
